<meta charset="utf-8">
<style>
.field { margin: 6px 0; }
</style>
<p>ตั้งรหัสผ่านใหม่</p>
<div class="field">New password :<br><input id="newPassword" type="password"></div>
<button id="resetBtn">เปลี่ยนรหัสผ่าน</button>
<p><a href="sign-in.html">กลับไป sign-in</a></p>
<p id="msg"></p>
<script>
const API = 'http://192.168.0.234:3000';
// token มาจาก ?token= ที่ better-auth ต่อให้ตอน redirect จากลิงก์ในเมล
const q = new URLSearchParams(window.location.search);
resetBtn.onclick = async () => {
  const token = new URLSearchParams(window.location.search).get('token');
  msg.textContent = 'กำลังเปลี่ยน...';
  const res = await fetch(API + '/api/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ newPassword: newPassword.value, token})
  });
  if (res.ok) { msg.textContent = 'เปลี่ยนแล้ว ไป sign-in ได้เลย'; }
  else msg.textContent = await res.text();
};
</script>
