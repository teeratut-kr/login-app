<meta charset="utf-8">
<style>
.field { margin: 6px 0; }
</style>
<p>ลงชื่อเข้าใช้</p>
<div class="field">Email :<br><input id="email"></div>
<div class="field">Password :<br><input id="password" type="password"></div>
<button id="okBtn">ตกลง</button>
<p id="msg"></p>
<script>
okBtn.onclick = async () => {
  const res = await fetch('http://192.168.0.234:3000/api/auth/sign-in/email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ email: email.value, password: password.value })
  })
  if (res.ok) window.location = 'index.html';
  else if (res.status === 403) {
    // ยังไม่ verify: จำรหัสไว้แล้วเด้งไปหน้า verify (กันตก)
    sessionStorage.setItem('pendingPassword', password.value)
    window.location = 'verify-otp.html?email=' + encodeURIComponent(email.value)
  }
  else msg.textContent = 'Invalid email or password'
}
</script>
