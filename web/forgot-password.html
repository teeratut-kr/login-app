<meta charset="utf-8">
<style>
.field { margin: 6px 0; }
</style>
<p>ลืมรหัสผ่าน กรอกอีเมลเพื่อรับลิงก์รีเซ็ต</p>
<div class="field">Email :<br><input id="email"></div>
<button id="reqBtn">ส่งลิงก์รีเซ็ต</button>
<p><a href="sign-in.html">กลับไป sign-in</a></p>
<p id="msg"></p>
<script>
const API = 'http://192.168.0.234:3000';
const WEB = 'http://192.168.0.234:8080';
reqBtn.onclick = async () => {
  msg.textContent = 'กำลังส่ง...';
  const res = await fetch(API + '/api/auth/request-password-reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ email: email.value, redirectTo: WEB + '/reset-password.html' })
  });
  msg.textContent = res.ok ? 'ส่งลิงก์แล้ว กรุณาดูในอีเมล' : await res.text();
};
</script>
