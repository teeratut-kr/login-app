<style>
.field { margin: 6px 0; }
</style>
<div id="show">Checking...</div>
<div id="guest" style="display:none">
  <p>ยังไม่ได้ login</p>
  <button id="goSignup">sign-up</button>
  <button id="goSignin">sign-in</button>
</div>
<div id="profile" style="display:none">
    <h3>ข้อมูลของคุณ</h3>
    <p>Email : <span id="vEmail"></span></p>
    <p>Password : <span id="vPassword"></span></p>
    <p>Name : <span id="vName"></span></p>
    <p>Age : <span id="vAge"></span></p>
    <h3>แก้ไขข้อมูล</h3>
    <div class="field">Email :<br><input id="email"></div>
    <div class="field">Password :<br><input id="password" type="password"></div>
    <div class="field">Name :<br><input id="nameInput"></div>
    <div class="field">Age :<br><input id="age" type="number"></div>
    <button id="updateBtn">update</button>
</div>
<script>
;(async () => {
    const res = await fetch('http://localhost:3000/me', { credentials: 'include' })
    if (!res.ok) {
    show.textContent = ''
    guest.style.display = ''
    goSignup.onclick = () => window.location = 'sign-up.html'
    goSignin.onclick = () => window.location = 'sign-in.html'
    return
  }
    const me = await res.json()
    show.textContent = ''
    profile.style.display = ''
    vEmail.textContent = me.email;
    vPassword.textContent = me.password;
    vName.textContent = me.name;
    vAge.textContent = me.age;
    email.value = me.email;
    nameInput.value = me.name;
    age.value = me.age;

    updateBtn.onclick = async () => {
        const body = {}
        if (email.value) body.email = email.value
        if (nameInput.value) body.name = nameInput.value
        if (age.value) body.age = Number(age.value)
        if (password.value) body.password = password.value
        await fetch('http://localhost:3000/me', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
        })
        window.location.reload()
    }
})()
</script>
